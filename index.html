<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout Jam</title>
<meta name="description" content="Checkout Jam – a supermarket checkout puzzle game for Android and iOS.">
<style>
:root{--tag:#FFD447;--tag-deep:#D9A900;--counter:#2E4A52;--ink:#3A2E00}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px 16px;text-align:center;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(120% 90% at 50% 36%,#FFE68F 0%,var(--tag) 48%,#F2B400 100%)}
.logo{width:72px;height:72px;margin:0 auto 14px;border-radius:20px;background:#fff;box-shadow:0 5px 0 rgba(58,46,0,.18);display:grid;place-items:center}
.logo svg{width:44px;height:44px}
h1{margin:0;font-size:44px;line-height:1;color:var(--counter)}
p{margin:10px 0 22px;font-weight:600;opacity:.85}
a{display:inline-block;padding:12px 20px;border-radius:14px;background:var(--counter);color:#fff;text-decoration:none;font-weight:800;box-shadow:0 4px 0 #1B3036}
.support{margin-top:22px;font-weight:700;font-size:15px}
.support a.mail{display:inline;padding:0;background:none;box-shadow:none;color:var(--counter);text-decoration:underline;font-weight:800}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#2E4A52" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.2 10.2a1.6 1.6 0 0 0 1.6 1.3h7.7a1.6 1.6 0 0 0 1.5-1.2L20 8H6.2"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg></div>
  <h1>Checkout Jam</h1>
  <p>Clear the store, send the carts out in the right order.</p>
  <a href="privacy/">Privacy Policy · Gizlilik Politikası</a>
  <div class="support">Support · Destek: <a class="mail" href="mailto:support@checkoutjam.net">support@checkoutjam.net</a></div>
</main>
</body>
</html>
